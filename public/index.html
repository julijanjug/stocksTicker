<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Stock Ticker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="ticker">
    <div class="ticker-text" id="tickerText">Loading ticker...</div>
  </div>

  <div class="ticker-info" id="tickerInfo">Loading info...</div>

  <div class="chart-container">
    <canvas id="stockChart"></canvas>
  </div>

  <div class="bottom-ribbon" id="bottomRibbon">
    Loading time...
  </div>

  <div class="click-area left" id="leftClickArea"></div>
  <div class="click-area right" id="rightClickArea"></div>

  <script src="app.js"></script>
</body>

</html>
